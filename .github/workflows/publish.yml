# Publishes @chamaeleonidae/chmln when the version in package.json is not on npm yet,
# then tags the commit <version>. npm trusted publishing authenticates this workflow by
# its GitHub OIDC identity, so no npm token exists. That npm setting names this file:
# renaming it stops publishing until the setting is updated. See RELEASING.md.
name: Publish to npm

on:
  push:
    branches: [main]

# Two merges in quick succession must not both try to publish the same version.
concurrency:
  group: npm-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.repository == 'chamaeleonidae/chmln'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the <version> tag
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24' # trusted publishing needs npm >= 11.5.1, bundled since Node 24.5
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm test

      - run: node scripts/publish-if-needed.mjs
